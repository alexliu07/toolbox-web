	<script>
	if (!Promise.withResolvers) {
		Promise.withResolvers = function() {
			let resolve, reject;
			const promise = new Promise(function(r, rj) { resolve = r; reject = rj; });
			return { promise: promise, resolve: resolve, reject: reject };
		};
	}
	</script>

<body>
	<div id="debug-panel" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:9999;overflow:auto;padding:16px;font-family:monospace;font-size:12px;"></div>
	<script>
	if (new URLSearchParams(location.search).get('debug') === '1') {
		var panel = document.getElementById('debug-panel');
		panel.style.display = 'block';
		var origError = window.onerror;
		var origConsole = {};
		['log','warn','error','info'].forEach(function(m) {
			origConsole[m] = console[m].bind(console);
			console[m] = function() {
				var msg = Array.from(arguments).map(function(a) {
					return typeof a === 'object' ? JSON.stringify(a) : String(a);
				}).join(' ');
				panel.innerHTML += '<p>[' + m + '] ' + msg + '</p>';
				origConsole[m].apply(console, arguments);
			};
		});
		window.onerror = function(msg, src, line, col) {
			panel.innerHTML += '<p>[error] ' + msg + ' (' + src + ':' + line + ':' + col + ')</p>';
			if (origError) origError.apply(null, arguments);
		};
	}
	</script>
</body>
